# Veilbidding extension stack - Coston2/Coston/local simulated.
#
# Usage:
#   docker compose up -d                                                       # default network
#   docker compose -f docker-compose.yaml -f docker-compose.coston.yaml up -d  # Coston
#   docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml up -d # Coston2

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    image: ${REGISTRY:-local}/tee-proxy
    # Named volume + subpath instead of a bind-mounted host file: bind-mounting
    # a single host file here causes EPERM on open() even though stat()
    # succeeds and permissions look correct (a macOS Docker Desktop
    # file-sharing quirk seen on this host with both gRPC-FUSE and VirtioFS).
    # Populate the volume with:
    #   docker run --rm -i -v tee_proxy_config:/data alpine sh -c "cat > /data/config.toml" \
    #     < config/proxy/<the active chain's config>.toml
    volumes:
      - tee_proxy_config:/app/config
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:-983760a4ebf75b2ac3a93531168a0f225d01e5dc6e3568adbd46233ba1fb4fa4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EXT_PROXY_INTERNAL_BIND:-0.0.0.0:6673}:6663"
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}
    env_file:
      - path: ./config/extension.env
        required: false
    environment:
      - MODE=${MODE:-1}
      # Chain id the node binds signatures to - must match the proxy's chain_id
      # and the chain itself. Defaults to Coston2 (114) like the base proxy
      # config; the coston override sets 16. Override via CHAIN_ID in .env.
      - CHAIN_ID=${CHAIN_ID:-114}
      - INITIAL_OWNER=${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}
      # TEE governance the node signs with. Must match what set-governance
      # registers on-chain (post-build reads the same vars). Defaults to the
      # deployer (INITIAL_OWNER) as sole signer, threshold 1; override in .env.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - TYPES_SERVER_PORT=8100
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Used by the auto-bidding agent watcher to fetch the TEE's own ECIES
      # public key (GET /info) so it can encrypt sealed bid terms the same
      # way a browser bidder would. Same value as VITE_EXT_PROXY_URL.
      - EXT_PROXY_URL=${EXT_PROXY_URL:-}
      - AGENT_STORE_PATH=/app/data/agents.json
    ports:
      - "${TYPES_SERVER_BIND:-127.0.0.1:8100}:8100"
      # Local-admin agent API (create/toggle/delete/run) - called directly by
      # the browser dev server on the same machine, not routed through
      # ext-proxy's public tunnel like /state and /action are (see
      # internal/extension/extension.go's New()).
      - "${AGENT_API_BIND:-127.0.0.1:7702}:7702"
    volumes:
      - agent_store:/app/data
    depends_on:
      - ext-proxy

volumes:
  tee_proxy_config:
    external: true
  agent_store:

networks:
  default:
    name: ${COMPOSE_NETWORK:-veilbidding-default}
